# test
name: Test package 
on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v2
      with:
         submodules: recursive        
        
    - name: List directory contents
      run: pwd; ls -la      
      
    - name: start xvfb
      run:
        Xvfb :0 &

    - name: initialize the X11 DISPLAY variable
      run:
        export DISPLAY=:0

    - name: After checkout, list directory contnts
      run: pwd; ls -la        

    - name: Build with Gradle 
      run: bash makeJar.sh
    - name: Resolve JDK archive from jvm.json
      run: echo "JVM_ARCHIVE=$(bash libraries/bowler-script-kernel/JCSG/jvm/getJdkArchiveFile.sh)" >> $GITHUB_ENV
    - name: Set Java
      uses: actions/setup-java@v1
      with:
        java-version: 25
        jdkFile: ${{ env.JVM_ARCHIVE }}

    - name: Run Unit Tests
      run: xvfb-run -s '-screen 0 1024x768x24' ./gradlew test