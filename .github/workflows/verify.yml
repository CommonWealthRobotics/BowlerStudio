# test
name: Test package 
on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v2
      with:
         submodules: recursive        
    - name: Install and verify pinned JDK from jvm.json
      run: |
        JVM_SCRIPTS=libraries/bowler-script-kernel/JCSG/jvm
        bash $JVM_SCRIPTS/installJdk.sh
        JAVA_HOME=$HOME/bin/CaDoodle-ApplicationInstall/$(bash $JVM_SCRIPTS/getJdkArchiveName.sh)
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
        
    - name: List directory contents
      run: pwd; ls -la      
      
    - name: start xvfb
      run:
        Xvfb :0 &

    - name: initialize the X11 DISPLAY variable
      run:
        export DISPLAY=:0

    - name: After checkout, list directory contnts
      run: pwd; ls -la        

    - name: Build with Gradle 
      run: bash makeJar.sh

    - name: Run Unit Tests
      run: xvfb-run -s '-screen 0 1024x768x24' ./gradlew test

  # Catch dependency changes that would make the lockfile inconsistent.
  # Regenerate after a dependency change and commit the result:
  #   ./gradlew --write-locks lockClasspaths
  lockfile-drift:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '25'

    - name: Regenerate lockfiles
      run: ./gradlew --no-daemon --write-locks lockClasspaths

    - name: Fail if lockfiles changed
      run: |
        if ! git diff --exit-code -- '**/gradle.lockfile' 'gradle.lockfile'; then
          echo "::error::gradle.lockfile is out of date. Regenerate it and commit the result:"
          echo "  ./gradlew --write-locks lockClasspaths"
          exit 1
        fi
